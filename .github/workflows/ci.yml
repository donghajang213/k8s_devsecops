name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write   # WIF(Workload Identity Federation)로 GCP 인증하는 데 필요

env:
  IMAGE: asia-northeast3-docker.pkg.dev/k8s-devsecops-dh/k8s-devsecops/api

jobs:
  secret-scan:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks가 전체 커밋 히스토리를 훑을 수 있게
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: bandit (Python SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run bandit
        run: |
          pip install bandit
          bandit -r src -ll   # low severity 이하는 무시, 그 이상만 실패 처리

  build-scan-push:
    name: build image, Trivy scan, push
    runs-on: ubuntu-latest
    needs: [secret-scan, sast]   # 시크릿/SAST부터 통과해야 이미지 빌드로 넘어감
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t "$IMAGE:${{ github.sha }}" .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE }}:${{ github.sha }}"
          severity: "CRITICAL,HIGH"
          exit-code: "1"   # CRITICAL/HIGH 취약점 있으면 워크플로 자체를 실패시킴
          ignore-unfixed: true

      # main 브랜치에 실제 push된 경우에만 레지스트리에 올린다 (PR에서는 스캔까지만)
      - name: Authenticate to GCP (Workload Identity Federation)
        if: github.event_name == 'push'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/505854951328/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider"
          service_account: "ci-deployer@k8s-devsecops-dh.iam.gserviceaccount.com"

      - name: Configure Docker for Artifact Registry
        if: github.event_name == 'push'
        run: gcloud auth configure-docker asia-northeast3-docker.pkg.dev --quiet

      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
