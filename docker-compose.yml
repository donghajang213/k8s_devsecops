services:
  db:
    image: postgres:18.4-trixie
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 5433:5432
  adminer:   # Adminer 웹 UI 컨테이너
    image: adminer
    restart: always
    ports:
      - 8081:8080
    volumes:
      - pg-data:/var/lib/postgresql # 18.4-trixie

volumes:
  pg-data: