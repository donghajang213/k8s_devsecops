apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      automountServiceAccountToken: false   # 이 파드는 K8s API를 호출하지 않으니 토큰을 아예 안 붙임
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000                     # Dockerfile의 appuser UID와 동일 (숫자로 명시해야 runAsNonRoot 검증이 통과됨)
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "asia-northeast3-docker.pkg.dev/k8s-devsecops-dh/k8s-devsecops/api:latest"
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: db-credentials
          env:
            - name: POSTGRES_HOST
              value: "db"
            - name: POSTGRES_PORT
              value: "5432"
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api   # ServiceMonitor.spec.selector가 Service 자신의 label을 보고 매칭함 (spec.selector와는 별개)
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
