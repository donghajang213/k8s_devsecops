apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  annotations:
    # ArgoCD 훅: Deployment 등 다른 리소스를 동기화하기 전에 먼저 실행됨
    argocd.argoproj.io/hook: PreSync
    # 다음 sync 때 새 Job을 만들기 전에 이전 Job을 지움 (Job은 spec 재적용이 불가능한 필드가 있어서 필요)
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: "Never"
      containers:
        - name: migrate
          image: "asia-northeast3-docker.pkg.dev/k8s-devsecops-dh/k8s-devsecops/api:latest"
          imagePullPolicy: Always
          command: ["uv", "run", "alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: db-credentials
          env:
            - name: POSTGRES_HOST
              value: "db"
            - name: POSTGRES_PORT
              value: "5432"
