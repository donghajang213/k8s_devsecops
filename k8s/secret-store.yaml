apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: k8s-devsecops-dh
      auth:
        workloadIdentity:
          clusterLocation: asia-northeast3-c
          clusterName: k8s-devsecops
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: db-credentials   # 기존 postgres.yaml/api.yaml/migrate-job.yaml이 참조하는 Secret 이름과 동일
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: db-user
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: db-password
    - secretKey: POSTGRES_DB
      remoteRef:
        key: db-name
