# default 네임스페이스의 모든 파드에 대해, 명시적으로 허용되지 않은 ingress(들어오는 트래픽)는 전부 차단.
# NetworkPolicy는 화이트리스트 방식이라, 이 정책 하나만으로 "기본 거부"가 성립하고
# 그 아래 정책들이 예외적으로 허용할 트래픽만 뚫어준다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}   # 네임스페이스의 모든 파드에 적용
  policyTypes:
    - Ingress
---
# Postgres는 api 파드와 db-migrate Job(마이그레이션)에서만 접근 가능하게 허용.
# 그 외(다른 네임스페이스, 클러스터 밖 등)는 default-deny-ingress에 의해 계속 차단됨.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-db-access
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - podSelector:
            matchLabels:
              job-name: db-migrate
      ports:
        - protocol: TCP
          port: 5432
