# default 네임스페이스에 Pod Security Standards 적용.
# "restricted"가 아니라 "baseline"을 쓴 이유: postgres 공식 이미지의 엔트리포인트가
# 데이터 디렉토리 권한(chown)을 맞추기 위해 컨테이너 시작을 root로 해야 하고(이후 내부적으로
# gosu로 postgres 유저에 권한을 넘김), "restricted"는 runAsNonRoot=true를 강제하기 때문에
# 공식 이미지를 변형 없이 못 씀. baseline은 privileged 컨테이너, hostNetwork/hostPID/hostIPC,
# 위험한 capability, hostPath 볼륨 등 널리 알려진 권한 상승 경로는 그대로 차단하면서
# 이 호환성 문제는 피할 수 있다. api 컨테이너는 자체 이미지가 이미 non-root라 restricted 수준의
# securityContext를 개별적으로 적용했다 (k8s/api.yaml 참고).
apiVersion: v1
kind: Namespace
metadata:
  name: default
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
